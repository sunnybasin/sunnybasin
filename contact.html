<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sunnybasin · contact</title>
<meta name="description" content="sunnybasin: composer, violinist, animator, dev and runner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon1.ico" type="image/x-icon">
<link rel="stylesheet" href="style.css?v=15">
<style>
/* button styles live here too, so these buttons work even if style.css is an older copy */
.nav-link{display:inline-block;font:700 14px "Pixelify Sans",monospace;color:#1c1707;background:#ffcf49;border:2px solid #1c1707;padding:11px 18px;text-decoration:none;box-shadow:4px 4px 0 #1c1707;transition:transform .1s,box-shadow .1s,background .15s}
.nav-link:hover,.nav-link:focus-visible{background:#f0b400;transform:translate(-2px,-2px);box-shadow:6px 6px 0 #1c1707}
.nav-link:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1c1707}
.lbtn{position:relative;display:inline-flex;align-items:center;gap:9px;padding:10px 16px;font:700 14px "Pixelify Sans",monospace;color:inherit;background:var(--alt,#fff8dc);border:2px solid #1c1707;box-shadow:4px 4px 0 #1c1707;text-decoration:none;transition:transform .1s,box-shadow .1s,background .15s}
.lbtn svg{width:20px;height:20px;flex-shrink:0}
.lbtn:hover,.lbtn:focus-visible{background:#ffcf49;color:#1c1707;transform:translate(-2px,-2px);box-shadow:6px 6px 0 #1c1707}
#linkrow{display:flex;flex-wrap:wrap;gap:16px}
</style>
</head>
<body data-page="contact">
<canvas id="dots"></canvas>
<nav>
  <div class="wrap">
    <a class="logo" href="index.html"><img class="logo-img" src="assets/02-53de2ebc.png" alt="">sunnybasin</a>
    <div class="links2" id="menu" style="display:contents">
      <a class="l" href="index.html" data-p="home">home</a><a class="l" href="about.html" data-p="about">about</a><a class="l" href="projects.html" data-p="projects">projects</a><a class="l on" href="contact.html" data-p="contact">contact</a>
    </div>
    <button class="tbtn" id="theme" aria-label="Toggle dark mode">☾</button>
    <button class="tbtn" id="burger" aria-label="Menu">≡</button>
  </div>
  <div id="prog"></div>
</nav>

<main id="top-of-page">
<header class="hero">
  <div class="wrap">
    <button id="avatar" aria-label="Poke the avatar"><img src="assets/02-53de2ebc.png" alt="pixel art avatar" width="100" style="width:100%;display:block"></button>
    <div>
      <h1>sunnybasin</h1>
      <p class="type" id="type" aria-live="off"></p>
    </div>
  </div>
</header>

<section id="contact"><div class="wrap contact">
  <div class="rv">
    <h2>Say hi</h2>
    <p style="margin:0 0 18px;color:var(--body)">need to talk? dm me on discord.</p>
    <button class="handle" id="copy" aria-label="Copy Discord handle">@sunnybasin</button>
    <p style="margin:6px 0 0;font-size:13px;color:var(--muted)">click to copy</p>
    <p class="px" style="margin:26px 0 0;color:var(--muted);font-size:14px">links (i don't upload as much anymore)</p>
    <div class="links" id="linkrow"></div>
  </div>
  <img class="rv" src="assets/10-1539eff3.png" alt="confused pixel character" id="conf">
</div></section>
<section id="message"><div class="wrap">
  <h2 class="rv">Send me a message</h2>
  <form class="box mform rv" id="mform" novalidate>
    <label for="mn">name (optional)</label>
    <input id="mn" name="name" type="text" maxlength="60" autocomplete="name">
    <label for="me">your email (optional, only if you want a reply)</label>
    <input id="me" name="email" type="email" maxlength="120" autocomplete="email">
    <label for="mm">message</label>
    <textarea id="mm" name="message" rows="6" maxlength="2000" required></textarea>
    <input type="text" name="website" id="mw" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
    <div class="mcap" id="mcap"></div>
    <div class="mrow"><button class="btn" type="submit" id="msend">send</button><span id="mstatus" role="status"></span></div>
  </form>
</div></section>

</main>

<footer>sunnybasin · updated 2026 · <a href="disclaimer.html">disclaimer</a></footer>

<div id="toast" role="status"></div>
<button id="top" aria-label="Back to top">↑</button>
<script src="songs.js?v=12"></script>
<script src="chips.js?v=12"></script>
<script src="script.js?v=12"></script>
<script src="interactables.js?v=12"></script>
</body>
</html>
